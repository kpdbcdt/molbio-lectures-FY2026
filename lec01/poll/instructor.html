<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分子生物学 Lec01 — 投票結果</title>
<style>
  :root {
    --primary: #2b6cb0;
    --primary-dark: #1a4a80;
    --accent: #e09f3e;
    --ok: #2e8b57;
    --ng: #d64545;
    --bg: #1a2633;
    --card: #233447;
    --ink: #ffffff;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    overflow: hidden;
  }
  .container {
    padding: 40px 60px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    margin-bottom: 24px;
  }
  .lec-tag {
    display: inline-block;
    background: var(--primary);
    color: white;
    padding: 4px 14px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .q-meta {
    color: var(--muted);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 36px;
    margin: 0 0 4px 0;
    line-height: 1.3;
  }
  .total {
    color: var(--muted);
    font-size: 18px;
    margin-top: 8px;
  }
  .total .num {
    color: white;
    font-weight: 700;
    font-size: 24px;
    font-family: 'SF Mono', Menlo, monospace;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 22px;
    justify-content: center;
    padding: 30px 0;
  }
  .row {
    display: grid;
    grid-template-columns: 80px 1fr 100px;
    gap: 24px;
    align-items: center;
  }
  .letter {
    font-size: 56px;
    font-weight: 800;
    text-align: center;
    background: var(--card);
    border-radius: 16px;
    padding: 14px 0;
    color: var(--muted);
  }
  .row.correct .letter {
    background: var(--ok);
    color: white;
  }
  .row.correct .bar { background: linear-gradient(90deg, var(--ok), #38a169); }
  .bar-area {
    background: rgba(255,255,255,0.06);
    height: 76px;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), #4a90d9);
    border-radius: 12px;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    align-items: center;
    padding-left: 22px;
  }
  .bar-label {
    font-size: 24px;
    font-weight: 700;
    color: white;
    white-space: nowrap;
  }
  .pct {
    font-size: 32px;
    font-weight: 800;
    text-align: right;
    font-family: 'SF Mono', Menlo, monospace;
    color: white;
  }
  .controls {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    justify-content: center;
  }
  .btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn.reveal { background: var(--accent); }
  .btn.reveal:hover { background: #c4881f; }
  .btn.reset { background: #4a5568; }
  .btn.reset:hover { background: #2d3748; }
  .btn.nav { background: #2d3748; }
  .qnav {
    position: absolute;
    top: 30px;
    right: 40px;
    display: flex;
    gap: 8px;
  }
  .qnav button {
    background: var(--card);
    color: var(--muted);
    border: 2px solid transparent;
    width: 50px;
    height: 50px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    font-family: inherit;
  }
  .qnav button.active {
    border-color: var(--primary);
    color: white;
    background: var(--primary);
  }
  .reveal-banner {
    background: linear-gradient(135deg, #fef5e7, #fef9c3);
    color: #744210;
    padding: 14px 20px;
    border-radius: 10px;
    font-size: 15px;
    line-height: 1.6;
    border: 2px solid var(--accent);
    display: none;
    margin-top: 14px;
  }
  .reveal-banner.shown { display: block; }
  .qr-info {
    position: absolute;
    bottom: 30px;
    right: 40px;
    color: var(--muted);
    font-size: 13px;
    font-family: 'SF Mono', Menlo, monospace;
    text-align: right;
  }
</style>
</head>
<body>

<div class="container">

<div class="qnav">
  <button data-q="1">Q1</button>
  <button data-q="2">Q2</button>
  <button data-q="3">Q3</button>
  <button data-q="4">Q4</button>
</div>

<header>
  <span class="lec-tag">📡 LIVE POLL · LEC 01</span>
  <div class="q-meta" id="q-meta">—</div>
  <h1 id="q-stem">—</h1>
  <div class="total">回答数 <span class="num" id="total-count">0</span></div>
</header>

<main id="bars"></main>

<div class="reveal-banner" id="reveal-banner"></div>

<div class="controls">
  <button class="btn reveal" id="btn-reveal">🎯 正解を公開</button>
  <button class="btn reset" id="btn-reset">🔄 投票リセット</button>
</div>

<div class="qr-info">
  学生 URL: <br>
  https://kpdbcdt.github.io/molbio-lectures-FY2026/lec01/poll/student.html?q=<span id="qnum-display">1</span>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getFirestore, doc, setDoc, onSnapshot, deleteField
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { POLLS } from "./poll-data.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const LETTERS = ['A', 'B', 'C', 'D'];
let currentQ = 1;
let unsub = null;
let revealed = false;

function loadQuestion(qNum) {
  if (unsub) unsub();
  currentQ = qNum;
  document.getElementById('qnum-display').textContent = qNum;
  document.querySelectorAll('.qnav button').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.q) === qNum);
  });
  const poll = POLLS['q' + qNum];
  document.getElementById('q-meta').textContent = `Slide ${poll.slide}  ·  質問 #${qNum}`;
  document.getElementById('q-stem').textContent = poll.stem;
  // Init bars
  const bars = document.getElementById('bars');
  bars.innerHTML = '';
  poll.options.forEach((opt, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.idx = i;
    row.innerHTML = `
      <div class="letter">${LETTERS[i]}</div>
      <div class="bar-area">
        <div class="bar" style="width:0%"><span class="bar-label">${opt}</span></div>
      </div>
      <div class="pct" data-count="0">0</div>
    `;
    bars.appendChild(row);
  });
  document.getElementById('reveal-banner').classList.remove('shown');
  document.getElementById('reveal-banner').textContent = '';
  revealed = false;

  // Subscribe
  const pollDoc = doc(db, 'polls_lec01', 'q' + qNum);
  unsub = onSnapshot(pollDoc, (snap) => {
    const data = snap.data() || {};
    updateBars(data.votes || {}, poll);
    if (data.revealed) {
      showReveal(poll);
    }
  });
}

function updateBars(votes, poll) {
  const counts = LETTERS.map(L => votes[L] || 0);
  const total = counts.reduce((a, b) => a + b, 0);
  const max = Math.max(...counts, 1);
  document.getElementById('total-count').textContent = total;
  document.querySelectorAll('#bars .row').forEach((row, i) => {
    const c = counts[i];
    const pct = total > 0 ? (c / total * 100) : 0;
    const widthPct = (c / max * 100);
    row.querySelector('.bar').style.width = widthPct + '%';
    const pctEl = row.querySelector('.pct');
    pctEl.textContent = c > 0 ? `${c} (${pct.toFixed(0)}%)` : '0';
    if (revealed) {
      row.classList.toggle('correct', i === poll.correct);
    }
  });
}

function showReveal(poll) {
  if (revealed) return;
  revealed = true;
  const banner = document.getElementById('reveal-banner');
  banner.classList.add('shown');
  banner.textContent = poll.reveal;
  document.querySelectorAll('#bars .row').forEach((row, i) => {
    row.classList.toggle('correct', i === poll.correct);
  });
}

document.querySelectorAll('.qnav button').forEach(b => {
  b.addEventListener('click', () => loadQuestion(parseInt(b.dataset.q)));
});

document.getElementById('btn-reveal').addEventListener('click', async () => {
  const pollDoc = doc(db, 'polls_lec01', 'q' + currentQ);
  await setDoc(pollDoc, { revealed: true }, { merge: true });
});

document.getElementById('btn-reset').addEventListener('click', async () => {
  if (!confirm(`Q${currentQ} の投票をリセットしますか？（全カウントを 0 に戻し、正解公開状態も解除）`)) return;
  const pollDoc = doc(db, 'polls_lec01', 'q' + currentQ);
  // Reset votes and revealed
  await setDoc(pollDoc, {
    votes: { A: 0, B: 0, C: 0, D: 0 },
    revealed: false,
    reset_at: new Date().toISOString(),
  }, { merge: true });
});

// Init Q1
loadQuestion(1);
</script>

</body>
</html>
